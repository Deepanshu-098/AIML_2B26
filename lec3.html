<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Functions</title>
</head>
<body>
    <script>
        let arr=[1,2,3,4,5];
        document.write(arr+"<br>");
        document.write(arr.length+"<br>");
        document.write(arr[2]+"<br>");
        arr.push(6);
        document.write(arr+"<br>");
        arr.pop(2);
        document.write(arr+"<br>");
        arr.shift();
        document.write(arr+"<br>"); 
        arr.splice(2,3,10);
        document.write(arr+"<br>");
        arr.slice(2,4);
        document.write(arr+"<br>");
        arr.unshift(6);
        document.write(arr+"<br>"); 
    </script>
</body>
</html>
